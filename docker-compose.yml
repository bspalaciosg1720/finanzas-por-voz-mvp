services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finanzas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d finanzas"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - finanzas_postgres_data:/var/lib/postgresql/data

volumes:
  finanzas_postgres_data:

