services:
  - type: web
    name: finanzas-por-voz-api
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    preDeployCommand: /app/.venv/bin/alembic upgrade head
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: finanzas-por-voz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://bspalaciosg1720.github.io"]'
      - key: PUBLIC_APP_URL
        value: https://bspalaciosg1720.github.io/finanzas-por-voz-mvp
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: INBOUND_EMAIL_ENABLED
        value: "false"
      - key: PRIVACY_MODE
        value: strict
      - key: FINANCIAL_AI_ENABLED
        value: "false"

databases:
  - name: finanzas-por-voz-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "18"
    databaseName: finanzas
    user: app
    ipAllowList: []
