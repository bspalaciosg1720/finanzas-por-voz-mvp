services:
  - type: web
    name: finanzas-por-voz-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_HOST
        value: aws-0-us-west-2.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://bspalaciosg1720.github.io"]'
      - key: PUBLIC_APP_URL
        value: https://bspalaciosg1720.github.io/finanzas-por-voz-mvp
      - key: EMAIL_DELIVERY_MODE
        value: file
      - key: EMAIL_FROM
        value: no-reply@finanzas.local
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: INBOUND_EMAIL_ENABLED
        value: "false"
      - key: PRIVACY_MODE
        value: strict
      - key: FINANCIAL_AI_ENABLED
        value: "false"
